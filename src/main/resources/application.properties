spring.application.name=todo-api
server.port=8081

# File-backed H2 keeps local data across application restarts. AUTO_SERVER allows
# tools such as DBeaver to inspect the same database while the API is running.
spring.datasource.url=jdbc:h2:file:./data/tododb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Appropriate for this practice project: Hibernate evolves the local schema
# without recreating the database on every application start.
spring.jpa.hibernate.ddl-auto=update

# Development-only browser console for inspecting the local H2 database.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
